<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 250" width="900" height="250" style="background:#070b16; border-radius:20px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="p-border-card-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="p-dots-card-4" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="250" rx="20" fill="#070b16"/>
  <rect width="900" height="250" fill="url(#p-dots-card-4)"/>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="19.25" fill="none" stroke="url(#p-border-card-4)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="2" y="24" width="4" height="202" rx="2" fill="#f59e0b"/>

  <!-- Top Header Title & CTA -->
  <g transform="translate(50, 26)">
    <rect width="240" height="24" rx="6" fill="#0e172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.7"/>
    <text x="120" y="16" fill="#f59e0b" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">
      05 // CORE SYSTEMS & NETWORKING
    </text>

    <!-- CTA Button on Right -->
    <a xlink:href="https://jedis-redis.vercel.app" target="_blank" style="cursor: pointer;">
      <g transform="translate(630, 0)">
        <rect width="170" height="26" rx="6" fill="#0b1224" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="85" y="17" fill="#f59e0b" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
          LIVE CONSOLE ↗
        </text>
      </g>
    </a>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(50, 68)">
    <text x="0" y="20" fill="#ffffff" font-size="18.5" font-weight="800">Jedis — Java 23 In-Memory Redis Clone</text>
    <text x="0" y="42" fill="#f59e0b" font-size="12" font-style="italic">"Raw TCP socket server with custom RESP 2/3 protocol parser, TTL & replication"</text>
  </g>

  <!-- 4 Architectural Highlights (2x2 Grid) -->
  <g transform="translate(50, 126)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">⚡ Raw TCP Socket Server:</tspan> Custom non-blocking event loop handling concurrency</text>
    </g>
    <g transform="translate(415, 0)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">🔌 RESP 2/3 Wire Protocol:</tspan> Byte-level parser for strings, errors, ints & arrays</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 38)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">🔁 Master-Slave Sync:</tspan> Distributed replication with PSYNC / WAIT offsets</text>
    </g>
    <g transform="translate(415, 38)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">⏱️ In-Memory Storage:</tspan> O(1) dictionary lookup with TTL timestamp eviction</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills Row -->
  <g transform="translate(50, 206)">
    <g transform="translate(0, 0)">
