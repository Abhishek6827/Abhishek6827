<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 76" width="440" height="76" style="background:#0b1224; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="btn-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .btn-arrow { animation: none !important; }
    }
    .btn-arrow {
      animation: btnArrow 1.5s ease-in-out infinite;
    }
    @keyframes btnArrow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }
  </style>

  <!-- Card Background & Border -->
  <rect width="440" height="76" rx="12" fill="#0b1224"/>
  <rect x="0.75" y="0.75" width="438.5" height="74.5" rx="11.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0.75" y="0.75" width="438.5" height="74.5" rx="11.25" fill="none" stroke="url(#btn-glow)" stroke-width="1.2"/>

  <!-- Left Icon -->
  <g transform="translate(16, 18)">
    
      <rect width="40" height="40" rx="9" fill="#4f46e5"/>
      <circle cx="20" cy="20" r="11" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <ellipse cx="20" cy="20" rx="5.5" ry="11" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <line x1="9" y1="20" x2="31" y2="20" stroke="#ffffff" stroke-width="1.4"/>
        
  </g>

  <!-- Center Text -->
  <g transform="translate(70, 24)">
    <text x="0" y="14" fill="#ffffff" font-size="14.5" font-weight="700">Personal Portfolio</text>
    <text x="0" y="32" fill="#94a3b8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11">portfolio.getchintu.com</text>
  </g>

  <!-- Right Action Badge -->
  <g transform="translate(325, 25)">
    <rect width="98" height="26" rx="6" fill="#0e172a" stroke="#818cf8" stroke-width="1"/>
    <text x="43" y="17" fill="#818cf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">EXPLORE</text>
    <g class="btn-arrow" transform="translate(74, 17)">
      <text x="0" y="0" fill="#818cf8" font-size="12" font-weight="700">→</text>
    </g>
  </g>
</svg>