<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 76" width="440" height="76" style="background:#0b1224; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="btn-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ea4335" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .btn-arrow { animation: none !important; }
    }
    .btn-arrow {
      animation: btnArrow 1.5s ease-in-out infinite;
    }
    @keyframes btnArrow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }
  </style>

  <!-- Card Background & Border -->
  <rect width="440" height="76" rx="12" fill="#0b1224"/>
  <rect x="0.75" y="0.75" width="438.5" height="74.5" rx="11.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0.75" y="0.75" width="438.5" height="74.5" rx="11.25" fill="none" stroke="url(#btn-glow)" stroke-width="1.2"/>

  <!-- Left Icon -->
  <g transform="translate(16, 18)">
    
      <rect width="40" height="40" rx="9" fill="#ea4335"/>
      <rect x="10" y="13" width="20" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M10 14 L20 21 L30 14" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        
  </g>

  <!-- Center Text -->
  <g transform="translate(70, 24)">
    <text x="0" y="14" fill="#ffffff" font-size="14.5" font-weight="700">Direct Email</text>
    <text x="0" y="32" fill="#94a3b8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11">abhishektiwari@getchintu.com</text>
  </g>

  <!-- Right Action Badge -->
  <g transform="translate(315, 25)">
    <rect width="108" height="26" rx="6" fill="#0e172a" stroke="#f87171" stroke-width="1"/>
    <text x="44" y="17" fill="#f87171" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">SEND MAIL</text>
    <g transform="translate(80, 17)">
      <g class="btn-arrow">
        <text x="0" y="0" fill="#f87171" font-size="12" font-weight="700">→</text>
      </g>
    </g>
  </g>
</svg>