  <text x="34" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Java 21</text>
</g>
<g transform="translate(106, 0)">
  <rect width="90" height="26" rx="13" fill="#0b1224" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.85"/>
  <circle cx="16" cy="13" r="3" fill="#a855f7"/>
  <text x="30" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">B+Tree</text>
</g>
