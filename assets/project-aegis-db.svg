<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 250" width="900" height="250" style="background:#070b16; border-radius:20px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="p-border-card-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="p-dots-card-5" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="250" rx="20" fill="#070b16"/>
  <rect width="900" height="250" fill="url(#p-dots-card-5)"/>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="19.25" fill="none" stroke="url(#p-border-card-5)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="2" y="24" width="4" height="202" rx="2" fill="#2dd4bf"/>

  <!-- Top Header Title & CTA -->
  <g transform="translate(50, 26)">
    <rect width="250" height="24" rx="6" fill="#0e172a" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.7"/>
    <text x="125" y="16" fill="#2dd4bf" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">
      06 // STORAGE ENGINES &amp; DBS
    </text>

    <!-- CTA Button on Right -->
    <a xlink:href="https://aegis-db.vercel.app" target="_blank" style="cursor: pointer;">
      <g transform="translate(630, 0)">
        <rect width="170" height="26" rx="6" fill="#0b1224" stroke="#2dd4bf" stroke-width="1.2"/>
        <text x="85" y="17" fill="#2dd4bf" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
          LIVE ENGINE ↗
        </text>
      </g>
    </a>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(50, 68)">
    <text x="0" y="20" fill="#ffffff" font-size="18.5" font-weight="800">AegisDB — Java 21 Embedded Database Engine</text>
    <text x="0" y="42" fill="#2dd4bf" font-size="12" font-style="italic">&quot;High-performance embedded storage engine with clustered B+Tree &amp; compressed bitmaps&quot;</text>
  </g>

  <!-- 4 Architectural Highlights (2x2 Grid) -->
  <g transform="translate(50, 126)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">🌳 Clustered B+Tree:</tspan> Balanced disk-backed tree for fast point &amp; range queries</text>
    </g>
    <g transform="translate(415, 0)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">🗃️ 4KB Buffer Pool:</tspan> Slotted disk page architecture with LRU cache eviction</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 38)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">⚡ Sub-50µs Filtering:</tspan> Compressed bitmap indexes for ultra-fast filtering</text>
    </g>
    <g transform="translate(415, 38)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5"><tspan font-weight="700">🔒 ACID Concurrency:</tspan> Collection-level Reader-Writer Lock thread safety</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills Row -->
  <g transform="translate(50, 206)">
    <g transform="translate(0, 0)">
  <rect width="96" height="26" rx="13" fill="#0b1224" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.85"/>
