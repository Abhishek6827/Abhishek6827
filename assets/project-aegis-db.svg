  <rect width="152" height="26" rx="13" fill="#0b1224" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.85"/>
  <circle cx="16" cy="13" r="3" fill="#2dd4bf"/>
  <text x="30" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">4KB Buffer Pool</text>
</g>
<g transform="translate(368, 0)">
  <rect width="130" height="26" rx="13" fill="#0b1224" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.85"/>
  <circle cx="16" cy="13" r="3" fill="#38bdf8"/>
  <text x="30" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Bitmap Index</text>
</g>
<g transform="translate(508, 0)">
  <rect width="122" height="26" rx="13" fill="#0b1224" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.85"/>
  <circle cx="16" cy="13" r="3" fill="#4ade80"/>
  <text x="30" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">ACID Engine</text>
