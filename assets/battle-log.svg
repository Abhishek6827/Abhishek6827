<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" style="background:#070b16; border-radius:20px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bl-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="bl-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
    <linearGradient id="bl-timeline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="530" rx="20" fill="#070b16"/>
  <rect width="900" height="530" fill="url(#bl-dots)"/>
  <rect x="0.75" y="0.75" width="898.5" height="528.5" rx="19.25" fill="none" stroke="url(#bl-border)" stroke-width="1.5"/>

  <!-- Top Header Title -->
  <g transform="translate(50, 32)">
    <rect width="170" height="24" rx="6" fill="#0e172a" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="85" y="16" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      03 // BATTLE LOG
    </text>
    <text x="185" y="16" fill="#94a3b8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11">CAREER TIMELINE &amp; PRODUCTION IMPACT</text>

    <!-- Top Right Active Badge -->
    <g transform="translate(630, 0)">
      <rect width="170" height="24" rx="6" fill="#0b1224" stroke="#10b981" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="16" cy="12" r="4" fill="#10b981"/>
      <text x="28" y="16" fill="#34d399" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.5">ACTIVE CONTRIBUTOR</text>
    </g>
  </g>

  <!-- Vertical Timeline Spine -->
  <line x1="85" y1="88" x2="85" y2="475" stroke="url(#bl-timeline-grad)" stroke-width="2.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>

  <!-- 5 Career Milestones -->

  <!-- Milestone: CHINTU AI -->
  <g transform="translate(50, 80)">
    <!-- Glowing Timeline Node -->
    <circle cx="35" cy="20" r="10" fill="#070b16" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="4" fill="#38bdf8"/>

    <!-- Content Card -->
    <rect x="58" y="0" width="742" height="74" rx="10" fill="#0b1224" stroke="#1e293b" stroke-width="1"/>

    <!-- Role & Company -->
    <text x="74" y="22" fill="#ffffff" font-size="14.5" font-weight="700">Founder & Full-Stack Developer</text>
    <text x="74" y="40" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">⚡ CHINTU AI</text>

    <!-- Date Badge (Right Aligned) -->
    <g transform="translate(600, 10)">
      <rect width="130" height="22" rx="5" fill="#0e172a" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.7"/>
      <text x="65" y="15" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📅 02/2026 – Present</text>
    </g>

    <!-- Description -->
    <text x="74" y="58" fill="#94a3b8" font-size="11.5">Built cross-platform AI Career Copilot (Desktop DMG/EXE + Android APK + Web). Multi-model LLM orchestration (Groq <200ms, OpenAI), voice synthesis & 3-tier Razorpay billing.</text>
  </g>

  <!-- Milestone: Indian Capital & Investment Ltd. -->
  <g transform="translate(50, 165)">
    <!-- Glowing Timeline Node -->
    <circle cx="35" cy="20" r="10" fill="#070b16" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="4" fill="#f59e0b"/>

    <!-- Content Card -->
    <rect x="58" y="0" width="742" height="74" rx="10" fill="#0b1224" stroke="#1e293b" stroke-width="1"/>

    <!-- Role & Company -->
    <text x="74" y="22" fill="#ffffff" font-size="14.5" font-weight="700">Full Stack Developer</text>
    <text x="74" y="40" fill="#f59e0b" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">⚡ Indian Capital & Investment Ltd.</text>

    <!-- Date Badge (Right Aligned) -->
    <g transform="translate(600, 10)">
      <rect width="130" height="22" rx="5" fill="#0e172a" stroke="#f59e0b" stroke-width="0.9" stroke-opacity="0.7"/>
      <text x="65" y="15" fill="#f59e0b" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📅 11/2025 – 02/2026</text>
    </g>

    <!-- Description -->
    <text x="74" y="58" fill="#94a3b8" font-size="11.5">Architected automated payment pipelines (Stripe + Zoho), webhooks & Resend notifications. Built Notion API workflows for real-time asset intelligence.</text>
  </g>

  <!-- Milestone: Vasnaani Education -->
  <g transform="translate(50, 248)">
    <!-- Glowing Timeline Node -->
    <circle cx="35" cy="20" r="10" fill="#070b16" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="4" fill="#34d399"/>

    <!-- Content Card -->
    <rect x="58" y="0" width="742" height="74" rx="10" fill="#0b1224" stroke="#1e293b" stroke-width="1"/>

    <!-- Role & Company -->
    <text x="74" y="22" fill="#ffffff" font-size="14.5" font-weight="700">Software Developer</text>
    <text x="74" y="40" fill="#34d399" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">⚡ Vasnaani Education</text>

    <!-- Date Badge (Right Aligned) -->
    <g transform="translate(600, 10)">
      <rect width="130" height="22" rx="5" fill="#0e172a" stroke="#34d399" stroke-width="0.9" stroke-opacity="0.7"/>
      <text x="65" y="15" fill="#34d399" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📅 08/2024 – 10/2025</text>
    </g>

    <!-- Description -->
    <text x="74" y="58" fill="#94a3b8" font-size="11.5">Led development of official education portal with Django REST APIs & React frontend. Optimized bundle performance and resolved critical UI/UX bottlenecks.</text>
  </g>

  <!-- Milestone: Hoping Minds -->
  <g transform="translate(50, 331)">
    <!-- Glowing Timeline Node -->
    <circle cx="35" cy="20" r="10" fill="#070b16" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="4" fill="#a78bfa"/>

    <!-- Content Card -->
    <rect x="58" y="0" width="742" height="74" rx="10" fill="#0b1224" stroke="#1e293b" stroke-width="1"/>

    <!-- Role & Company -->
    <text x="74" y="22" fill="#ffffff" font-size="14.5" font-weight="700">Full-Stack Developer Intern</text>
    <text x="74" y="40" fill="#a78bfa" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">⚡ Hoping Minds</text>

    <!-- Date Badge (Right Aligned) -->
    <g transform="translate(600, 10)">
      <rect width="130" height="22" rx="5" fill="#0e172a" stroke="#a78bfa" stroke-width="0.9" stroke-opacity="0.7"/>
      <text x="65" y="15" fill="#a78bfa" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📅 01/2024 – 06/2024</text>
    </g>

    <!-- Description -->
    <text x="74" y="58" fill="#94a3b8" font-size="11.5">Delivered responsive full-stack features in cross-functional agile sprints. Standardized Redux state management and clean modular UI components.</text>
  </g>

  <!-- Milestone: Quizario -->
  <g transform="translate(50, 414)">
    <!-- Glowing Timeline Node -->
    <circle cx="35" cy="20" r="10" fill="#070b16" stroke="#f43f5e" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="4" fill="#f43f5e"/>

    <!-- Content Card -->
    <rect x="58" y="0" width="742" height="74" rx="10" fill="#0b1224" stroke="#1e293b" stroke-width="1"/>

    <!-- Role & Company -->
    <text x="74" y="22" fill="#ffffff" font-size="14.5" font-weight="700">Web Developer</text>
    <text x="74" y="40" fill="#f43f5e" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">⚡ Quizario</text>

    <!-- Date Badge (Right Aligned) -->
    <g transform="translate(600, 10)">
      <rect width="130" height="22" rx="5" fill="#0e172a" stroke="#f43f5e" stroke-width="0.9" stroke-opacity="0.7"/>
      <text x="65" y="15" fill="#f43f5e" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📅 11/2023 – 12/2023</text>
    </g>

    <!-- Description -->
    <text x="74" y="58" fill="#94a3b8" font-size="11.5">Created interactive assessment & quiz platform with real-time scoring, secure student authentication, state persistence, and responsive layouts.</text>
  </g>
</svg>