      <stop offset="0%" stop-color="#247bff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.3"/>
