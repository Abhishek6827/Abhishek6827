<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="900" height="76" style="background:#070b16; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="mph-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="mph-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="76" rx="16" fill="#070b16"/>
  <rect width="900" height="76" fill="url(#mph-dots)"/>
  <rect x="0.75" y="0.75" width="898.5" height="74.5" rx="15.25" fill="none" stroke="url(#mph-border)" stroke-width="1.5"/>

  <!-- Content -->
  <g transform="translate(36, 25)">
    <rect width="190" height="26" rx="6" fill="#0e172a" stroke="#247bff" stroke-width="1" stroke-opacity="0.6"/>
    <text x="95" y="17" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2">
      06 // ECOSYSTEM APPS
    </text>
    <text x="210" y="18" fill="#94a3b8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5">
      ADDITIONAL PRODUCTION DEPLOYMENTS &amp; TOOLS
    </text>

    <!-- Right Badge -->
    <g transform="translate(650, 0)">
      <rect width="176" height="26" rx="6" fill="#0b1224" stroke="#6366f1" stroke-width="1.1"/>
      <text x="88" y="17" fill="#818cf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">EXPLORE ALL APPS ↗</text>
    </g>
