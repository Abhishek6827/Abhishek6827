<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 250" width="900" height="250" style="background:#070b16; border-radius:20px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="p-border-04 // FLAGSHIP 03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="p-dots-04 // FLAGSHIP 03" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="250" rx="20" fill="#070b16"/>
  <rect width="900" height="250" fill="url(#p-dots-04 // FLAGSHIP 03)"/>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="19.25" fill="none" stroke="url(#p-border-04 // FLAGSHIP 03)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="2" y="24" width="4" height="202" rx="2" fill="#a855f7"/>

  <!-- Top Header Title & CTA -->
  <g transform="translate(50, 26)">
    <rect width="180" height="24" rx="6" fill="#0e172a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6"/>
    <text x="90" y="16" fill="#a855f7" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
      04 // FLAGSHIP 03
    </text>

    <!-- CTA Button on Right -->
    <a xlink:href="https://socialconnect.getchintu.com/login" target="_blank" style="cursor: pointer;">
      <g transform="translate(630, 0)">
        <rect width="170" height="26" rx="6" fill="#0b1224" stroke="#a855f7" stroke-width="1.2"/>
        <text x="85" y="17" fill="#a855f7" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
          LIVE APP ↗
        </text>
      </g>
    </a>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(50, 68)">
    <text x="0" y="20" fill="#ffffff" font-size="19" font-weight="800">Social Connect — Full-Stack Real-Time Social Platform</text>
    <text x="0" y="42" fill="#a855f7" font-size="12.5" font-style="italic">"Real-time social media application with WebRTC video/audio & chat"</text>
  </g>

  <!-- 4 Architectural Highlights (2x2 Grid) -->
  <g transform="translate(50, 126)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5">💬 Real-Time Chat: Socket.io instant messaging & reactions</text>
    </g>
    <g transform="translate(415, 0)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5">📞 WebRTC Calls: Peer-to-peer audio & video call signaling</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 38)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5">🔐 Authentication: JWT with bcrypt, Google & FB OAuth 2.0</text>
    </g>
    <g transform="translate(415, 38)">
      <rect width="385" height="30" rx="6" fill="#0b1224" stroke="#1e293b" stroke-width="0.9"/>
      <text x="12" y="19" fill="#e2e8f0" font-size="11.5">👤 Social Ecosystem: User profiles, activity feeds & dashboards</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills Row -->
  <g transform="translate(50, 206)">
