<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 104" width="440" height="104" style="background:#0b1224; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .tile-nudge { animation: none !important; }
    }
    .tile-nudge {
      animation: tileNudge 1.6s ease-in-out infinite;
    }
    @keyframes tileNudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="440" height="104" rx="12" fill="#0b1224"/>
  <rect x="0.75" y="0.75" width="438.5" height="102.5" rx="11.25" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0.75" y="0.75" width="438.5" height="102.5" rx="11.25" fill="none" stroke="url(#tile-grad)" stroke-width="1.2"/>

  <!-- Content -->
  <g transform="translate(20, 18)">
    <!-- Top Row: Name and Live Badge -->
    <text x="0" y="16" fill="#ffffff" font-size="15" font-weight="700">Kanban WorkBoard</text>

    <!-- Badge on Right (Outer G sets static x=315, Inner G nudges) -->
    <g transform="translate(315, 0)">
      <g class="tile-nudge">
        <rect width="84" height="22" rx="5" fill="#0e172a" stroke="#38bdf8" stroke-width="0.9"/>
        <text x="42" y="15" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">LIVE APP ↗</text>
      </g>
    </g>

    <!-- Description -->
    <text x="0" y="40" fill="#94a3b8" font-size="11.5">Project board with drag-and-drop &amp; Django backend</text>

    <!-- Tech Stack Pill Bar -->
    <g transform="translate(0, 52)">
      <rect width="400" height="20" rx="4" fill="#070b16"/>
      <circle cx="12" cy="10" r="3" fill="#38bdf8"/>
      <text x="22" y="14" fill="#38bdf8" font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="600">Django · React · Redux</text>
    </g>
  </g>
</svg>